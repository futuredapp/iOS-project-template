name: Code review

# AI review of every push to a ready PR and on a "/review" comment, and the required "review-gate" status.
# The shared workflow picks the events each part runs on.
on:
  pull_request:
    # No "edited": a description edit would only add skipped checks. After a retarget to develop, comment /review.
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    uses: futuredapp/.github/.github/workflows/universal-cloud-ai-pr-review.yml@2.10.1
    with:
      marketplace_repository: futuredapp/FTClaudeMarketplace
      skill: ios-review-plugin:ios-pr-check
    # Only what the review uses, so it never sees the project's signing or App Store Connect secrets.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_MARKETPLACE_SSH_KEY: ${{ secrets.CLAUDE_MARKETPLACE_SSH_KEY }}
