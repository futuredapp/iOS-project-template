name: Nightly build

on:
  # Enable a workflow to be triggered manually
  workflow_dispatch:

  # Schedule docs https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  # Check cron syntax here https://crontab.guru/
  # Schedule to run this workflow at 00:00 UTC every tuesday to saturday
  schedule:
    - cron: '0 0 * * 2-6'

jobs:
  build:
    uses: futuredapp/.github/.github/workflows/ios-selfhosted-nightly-build.yml@2.8.0

    secrets:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      JIRA_CONTEXT: ${{ secrets.JIRA_CONTEXT }}

  # Slack ping to the project reviewer for PRs labeled feature-complete in this build.
  feature-review:
    needs: build
    if: needs.build.outputs.from_commit != ''
    permissions:
      contents: read
      pull-requests: read
    uses: futuredapp/.github/.github/workflows/universal-cloud-feature-review-notify.yml@2.8.0
    with:
      from_commit: ${{ needs.build.outputs.from_commit }}
      to_commit: ${{ needs.build.outputs.to_commit }}
      reviewer: ${{ vars.FEATURE_REVIEWER_SLACK }}
      build_name: 'iOS nightly build'
    secrets:
      SLACK_WEBHOOK_FEATURE_REVIEW: ${{ secrets.SLACK_WEBHOOK_FEATURE_REVIEW }}
