name: Review gate

# Keeps the required "review-gate" status current: AI review done, and an approval on needs-human PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  statuses: write
  pull-requests: read
  issues: read

jobs:
  gate:
    uses: futuredapp/.github/.github/workflows/universal-cloud-review-gate.yml@2.8.0
